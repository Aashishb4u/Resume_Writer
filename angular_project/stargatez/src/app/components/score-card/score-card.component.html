<div class="right-0 mt-20 lg:mt-0 top-[130px] lg:sticky bg-white p-6 rounded-2xl shadow-md w-full max-w-2xl mx-auto">
    <!-- Header -->
    <h2 class="text-lg font-semibold text-center text-gray-800">Your Score</h2>
    <div class="text-3xl font-bold text-center text-pink-500 mt-2">{{ score }}/100</div>
    <p class="text-center text-base text-gray-500 mb-4">{{ issues }} Issues</p>
    <hr class="my-4" />

    <!-- Accordion -->
    <div *ngFor="let section of sections; let i = index" class="border-b border-gray-100">
        <!-- Accordion Header -->
        <div class="flex justify-between items-center px-3 py-3 cursor-pointer" (click)="toggle(i)">
            <span class="text-base text-gray-700 font-medium uppercase">
                {{ section.label }}
            </span>
            <div class="flex items-center gap-6">
                <span class="text-base font-semibold px-4 py-0.5 rounded-full  text-center"
                    [ngClass]="section.color">
                    {{ section.score }}%
                </span>
                <svg class="w-4 h-4 text-gray-500 transform transition-transform duration-300"
                    [ngClass]="{ 'rotate-180': section.isOpen }" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 14l-6-6h12l-6 6z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>

        <!-- Accordion Content -->
        <div *ngIf="section.isOpen" class="text-base text-gray-700 px-2 pb-3 space-y-2">
            <div *ngFor="let item of section.description" class="flex items-center gap-2">
                <span class="text-yellow-500">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm0-4a1 1 0 110-2 1 1 0 010 2z"
                            clip-rule="evenodd" />
                    </svg>
                </span>
                <span>{{ item }}</span>
            </div>
        </div>
    </div>

    <!-- Button -->

        Unlock Full Report
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">

        </svg>
    </button> -->
</div>
